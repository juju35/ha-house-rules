name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "custom_components/house_rules/frontend/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/screenshots.yml"

# Protected main is never pushed to: the job commits the refreshed screenshots back onto the pull request's own
# branch, so they land through the normal merge. The push is made as the GitHub App (secrets APP_ID and
# APP_PRIVATE_KEY): unlike a GITHUB_TOKEN push, it starts the pull request's checks on the screenshot commit, so the
# required checks are never left waiting. The run it starts here renders the same pixels and pushes nothing.
permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    # The bot's own screenshots commit re-triggers this workflow: skip it (a skipped job counts as passed),
    # so a render that is not byte-identical can never loop.
    if: github.actor != 'juju35-screenshots[bot]'
    runs-on: ubuntu-latest
    # Debian 12 container (Python 3.13 included): apt goes to the Debian mirrors, not the runner's Ubuntu ones, which
    # kept hanging. The job runs as root, hence no sudo below.
    container: python:3.13-bookworm
    # In a container, run steps default to sh (dash, no pipefail): keep bash.
    defaults:
      run:
        shell: bash
    env:
      # Same-repo pull requests get the screenshots pushed back; fork PRs (no secrets) and manual runs never push.
      PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: App token
        id: app
        if: env.PUSH == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # APP_ID holds the App ID or its Client ID: both are accepted as client-id.
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PR branches do not exist in this repository: only check out the head branch for same-repo PRs.
          ref: ${{ env.PUSH == 'true' && github.head_ref || '' }}
          token: ${{ steps.app.outputs.token || github.token }}
      # The workspace is owned by another user than the container's root: let git work in it (commit step).
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install playwright==1.64.1 pillow==11.3.0
      # The browser download is time-boxed and retried, so a slow CDN cannot block the job indefinitely.
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          ok=
          for i in 1 2 3; do
            timeout 180 playwright install chromium && ok=1 && break
            echo "chromium download attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::chromium download failed 3 times"; exit 1; }
      # ffmpeg (header GIFs) + Roboto + the browser's apt deps, each apt call time-boxed and retried.
      - name: Install ffmpeg, Roboto and browser deps
        timeout-minutes: 12
        run: |
          ok=
          for i in 1 2 3; do
            timeout 150 apt-get update \
              && DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends ffmpeg fonts-roboto \
              && timeout 300 playwright install-deps chromium \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }
          ffmpeg -version > /dev/null
      # The frontend files are assembled from their ES modules in src/ (build output, not committed).
      - name: Build the frontend
        uses: ./.github/actions/build-frontend
      - name: Render screenshots
        run: |
          set -o pipefail
          python scripts/screenshots.py 2>&1 | tee /tmp/screenshots.log || {
            echo "::error::screenshots failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
            exit 1
          }
          if grep -q "page error" /tmp/screenshots.log; then
            echo "::error::a page error happened while rendering (see the log)"
            exit 1
          fi
      - name: Commit refreshed screenshots
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          BOT_ID="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | grep -m1 -o '"id": *[0-9]*' | grep -o '[0-9]*$')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots"
          git push
      - name: Upload screenshots artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
